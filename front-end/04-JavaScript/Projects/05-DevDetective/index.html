<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDetective</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrapper">
      <main>
        <div id="header">
          <h1>DevDetective</h1>
        </div>

        <div id="searchBar">
          <input
            type="text"
            placeholder="Enter a GitHub Username..."
            id="Input"
          />
          <div id="searchBtn">Search</div>
        </div>

        <div id="repoContainer">
          <div id="profile">
            <div id="profilePic">
              <img src="" alt="" id="photo" />
            </div>
            <div id="profileDetails">
              <h2 id="name"></h2>
              <a href="" id="Username"></a>
              <p id="joiningDetails"></p>
            </div>
          </div>

          <p id="description"></p>

          <div id="userWorkDetails">
            <p>
              Repos <br />
              <span id="repoCount"></span>
            </p>
            <p>
              Followers <br />
              <span id="FollowersCount"></span>
            </p>
            <p>
              Following <br />
              <span id="FollowingCount"></span>
            </p>
          </div>

          <div id="otherDetails">
            <div id="location">
              <!-- <img src="" alt="" /> -->
              <p id="address"></p>
            </div>

            <div id="PortfolioSection">
              <!-- <img src="" alt="" /> -->
              <a id="Portfolio" href=""></a>
            </div>

            <div id="twitterLink">
              <!-- <img src="" alt="" /> -->
              <a href="" id="twitter"></a>
            </div>

            <div id="jobDetails">
              <!-- <img src="" alt="" /> -->
              <p id="Profession"></p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
